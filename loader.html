<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading... | Ram Pyari Kundan Lal Mahajan NGO</title>
<style>
  /* Keeps the orange background and centers the logo */
  body {
    margin: 0;
    padding: 0;
    background-color: #ff9933; /* Orange/Saffron background */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh; /* Full screen height */
    overflow: hidden;
  }

  /* Logo styling and pulse animation */
  .splash-logo {
    width: 180px; /* Adjust if you want the logo bigger or smaller */
    height: auto;
    animation: splashPulse 1.5s infinite ease-in-out;
  }

  @keyframes splashPulse {
    0% { transform: scale(0.95); opacity: 0.9; }
    50% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.9; }
  }
</style>
</head>
<body>

  <!-- Your Logo -->
  <img src="assets/images/image.png" alt="NGO Logo" class="splash-logo">

  <script>
    // 5500 milliseconds = 5.5 seconds
    // After the time is up, this redirects the browser to your main website page
    setTimeout(function() {
      window.location.href = 'index.html';
    }, 2000);
  </script>

</body>
</html>
